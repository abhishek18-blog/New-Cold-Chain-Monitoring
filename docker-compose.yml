services:
  # ==========================================================
  # 1. GOOGLE CLOUD EMULATORS (Pub/Sub & Firestore)
  # ==========================================================
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: coldchain-pubsub-emulator
    restart: unless-stopped
    command: gcloud beta emulators pubsub start --project=coldchain-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: coldchain-firestore-emulator
    restart: unless-stopped
    command: gcloud beta emulators firestore start --project=coldchain-local --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"
    volumes:
      - firestore_data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8086/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  pubsub-init:
    build:
      context: ./pubsub-init
      dockerfile: Dockerfile
    container_name: coldchain-pubsub-init
    restart: "no"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-telemetry-topic}
      PUBSUB_SUB: ${PUBSUB_SUB:-telemetry-sub}
      PUBSUB_DLQ_TOPIC: ${PUBSUB_DLQ_TOPIC:-telemetry-dlq-topic}
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  # ==========================================================
  # 2. TELEMETRY GENERATOR (Publishes directly to Cloud Pub/Sub)
  # ==========================================================
  telemetry-generator:
    build:
      context: ./telemetry-generator
      dockerfile: Dockerfile
    container_name: coldchain-telemetry-generator
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-telemetry-topic}
      PING_INTERVAL_SEC: "${PING_INTERVAL_SEC:-5}"
      EXCURSION_PROBABILITY: "${EXCURSION_PROBABILITY:-0.015}"
      STRESS_MODE: "${STRESS_MODE:-false}"
    volumes:
      - ./data/shipment-sensor-dataset.csv:/app/dataset.csv:ro
      - ./scripts:/app/scripts:ro
      - ./telemetry-generator/generator.py:/app/generator.py:ro
    depends_on:
      pubsub-init:
        condition: service_completed_successfully

  # ==========================================================
  # 3. STREAM PROCESSOR (Cloud Pub/Sub -> Firestore live_status & alerts)
  # ==========================================================
  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: coldchain-processor
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      PUBSUB_SUB: ${PUBSUB_SUB:-telemetry-sub}
      PUBSUB_ALERTS_TOPIC: ${PUBSUB_ALERTS_TOPIC:-alerts-topic}
      PUBSUB_DLQ_TOPIC: ${PUBSUB_DLQ_TOPIC:-telemetry-dlq-topic}
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      firestore-emulator:
        condition: service_healthy

  # ==========================================================
  # 4. SILENCE DETECTOR (Flags dead trucks > 120s as NO_SIGNAL)
  # ==========================================================
  silence-detector:
    build:
      context: ./silence-detector
      dockerfile: Dockerfile
    container_name: coldchain-silence-detector
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      SILENCE_CHECK_INTERVAL_SEC: "${SILENCE_CHECK_INTERVAL_SEC:-30}"
      SILENCE_TIMEOUT_SEC: "${SILENCE_TIMEOUT_SEC:-120}"
    depends_on:
      firestore-emulator:
        condition: service_healthy

  # ==========================================================
  # 5. ALERT NOTIFIER (Driver Discord Push & Fleet Ops Alerts)
  # ==========================================================
  alert-notifier:
    build:
      context: ./alert-notifier
      dockerfile: Dockerfile
    container_name: coldchain-alert-notifier
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_ALERTS_SUB: ${PUBSUB_ALERTS_SUB:-alerts-sub}
      ALERT_COOLDOWN_SEC: "${ALERT_COOLDOWN_SEC:-900}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/1562083725309775932/47uha9d8Ktdx0WziYRu6zOR_u7440PUIB2jicXUxbPtkrSM28YesJLeUt1jnjpXtknTr}"
      DISCORD_VOICE_TTS: "${DISCORD_VOICE_TTS:-false}"
    volumes:
      - ./alert-notifier:/app
    depends_on:
      pubsub-init:
        condition: service_completed_successfully

  # ==========================================================
  # 6. DASHBOARD API & FRONTEND (FastAPI + Leaflet UI on port 8000)
  # ==========================================================
  dashboard-api:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: coldchain-dashboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-telemetry-topic}
      DASHBOARD_PORT: "8000"
    volumes:
      - ./dashboard/static:/app/static
      - ./dashboard/main.py:/app/main.py:ro
    depends_on:
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully

volumes:
  firestore_data:
