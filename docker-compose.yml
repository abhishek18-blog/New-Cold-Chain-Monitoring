services:
  # ==========================================================
  # 1. KAFKA CLUSTER (KRaft Mode - 2 Brokers + 1 Quorum Controller)
  # ==========================================================
  kafka-1:
    image: apache/kafka:4.0.0
    container_name: coldchain-kafka-1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-quorum:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShTUiBenVKWFXRCQ"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-2:
    image: apache/kafka:4.0.0
    container_name: coldchain-kafka-2
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-quorum:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19094,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19094,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShTUiBenVKWFXRCQ"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19094 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19094 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-quorum:
    image: apache/kafka:4.0.0
    container_name: coldchain-kafka-quorum
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-quorum:9093"
      KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShTUiBenVKWFXRCQ"
    volumes:
      - kafka_quorum_data:/var/lib/kafka/data

  # ==========================================================
  # 2. KAFKA INITIALIZER (Creates topics with RF 2)
  # ==========================================================
  kafka-init:
    build:
      context: ./kafka-init
      dockerfile: Dockerfile
    container_name: coldchain-kafka-init
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy

  # ==========================================================
  # 3. KAFKA UI (Cluster Dashboard)
  # ==========================================================
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: coldchain-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8082}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "coldchain-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:19092,kafka-2:19094"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy

  # ==========================================================
  # 4. GOOGLE CLOUD EMULATORS (Pub/Sub & Firestore)
  # ==========================================================
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: coldchain-pubsub-emulator
    restart: unless-stopped
    command: gcloud beta emulators pubsub start --project=coldchain-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: coldchain-firestore-emulator
    restart: unless-stopped
    command: gcloud beta emulators firestore start --project=coldchain-local --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"
    volumes:
      - firestore_data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8086/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  pubsub-init:
    build:
      context: ./pubsub-init
      dockerfile: Dockerfile
    container_name: coldchain-pubsub-init
    restart: "no"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-telemetry-topic}
      PUBSUB_SUB: ${PUBSUB_SUB:-telemetry-sub}
      PUBSUB_DLQ_TOPIC: ${PUBSUB_DLQ_TOPIC:-telemetry-dlq-topic}
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  # ==========================================================
  # 5. TELEMETRY GENERATOR (Simulates 5 trucks)
  # ==========================================================
  telemetry-generator:
    build:
      context: ./telemetry-generator
      dockerfile: Dockerfile
    container_name: coldchain-telemetry-generator
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
      KAFKA_TOPIC_TELEMETRY: "truck-telemetry"
      PING_INTERVAL_SEC: "${PING_INTERVAL_SEC:-5}"
      EXCURSION_PROBABILITY: "${EXCURSION_PROBABILITY:-0.015}"
      STRESS_MODE: "${STRESS_MODE:-false}"
    volumes:
      - ./data/shipment-sensor-dataset.csv:/app/dataset.csv:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ==========================================================
  # 6. PUBSUB BRIDGE (Kafka -> Pub/Sub with manual commit)
  # ==========================================================
  pubsub-bridge:
    build:
      context: ./pubsub-bridge
      dockerfile: Dockerfile
    container_name: coldchain-pubsub-bridge
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
      KAFKA_TOPIC_TELEMETRY: "truck-telemetry"
      KAFKA_GROUP_ID: "pubsub-bridge"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-telemetry-topic}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully

  # ==========================================================
  # 7. RAW DATA ARCHIVER (Kafka -> Partitioned .jsonl.gz files)
  # ==========================================================
  archiver:
    build:
      context: ./archiver
      dockerfile: Dockerfile
    container_name: coldchain-archiver
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
      KAFKA_TOPIC_TELEMETRY: "truck-telemetry"
      KAFKA_GROUP_ID: "archiver"
      ARCHIVE_BASE_DIR: "/archive/truck-data"
      ARCHIVE_FLUSH_RECORDS: "${ARCHIVE_FLUSH_RECORDS:-1000}"
      ARCHIVE_FLUSH_INTERVAL_SEC: "${ARCHIVE_FLUSH_INTERVAL_SEC:-30}"
    volumes:
      - ./data/archive:/archive/truck-data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ==========================================================
  # 8. STREAM PROCESSOR (Pub/Sub Pull -> Firestore live_status & alerts)
  # ==========================================================
  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: coldchain-processor
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      PUBSUB_SUB: ${PUBSUB_SUB:-telemetry-sub}
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
      KAFKA_TOPIC_DLQ: "truck-telemetry-dlq"
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
      firestore-emulator:
        condition: service_healthy

  # ==========================================================
  # 9. SILENCE DETECTOR (Flags dead trucks > 120s as NO_SIGNAL)
  # ==========================================================
  silence-detector:
    build:
      context: ./silence-detector
      dockerfile: Dockerfile
    container_name: coldchain-silence-detector
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      SILENCE_CHECK_INTERVAL_SEC: "${SILENCE_CHECK_INTERVAL_SEC:-30}"
      SILENCE_TIMEOUT_SEC: "${SILENCE_TIMEOUT_SEC:-120}"
    depends_on:
      firestore-emulator:
        condition: service_healthy

  # ==========================================================
  # 10. ALERT NOTIFIER (Driver SMS, In-Cab Buzzer & Ops Alerts)
  # ==========================================================
  alert-notifier:
    build:
      context: ./alert-notifier
      dockerfile: Dockerfile
    container_name: coldchain-alert-notifier
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      PUBSUB_EMULATOR_HOST: "pubsub-emulator:8085"
      PUBSUB_ALERTS_SUB: ${PUBSUB_ALERTS_SUB:-alerts-sub}
      ALERT_COOLDOWN_SEC: "${ALERT_COOLDOWN_SEC:-900}"
      FAST2SMS_API_KEY: "${FAST2SMS_API_KEY:-gonFrx9EB2estW7qyRYdpMhK8ia4LDuZvlJfQVCzcSAwIPb60OAa5MFRwg3Y6hWKesurm2ZpXTUx4OLN}"
    depends_on:
      pubsub-init:
        condition: service_completed_successfully

  # ==========================================================
  # 10. DASHBOARD API & FRONTEND (FastAPI + Leaflet UI on port 8000)
  # ==========================================================
  dashboard-api:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: coldchain-dashboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-coldchain-local}
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8086"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094"
      KAFKA_TOPIC_TELEMETRY: "truck-telemetry"
      DASHBOARD_PORT: "8000"
    volumes:
      - ./dashboard/static:/app/static
    depends_on:
      firestore-emulator:
        condition: service_healthy

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_quorum_data:
  # FIX M1: Removed orphaned 'archive_data' volume that was declared here but
  # never mounted by any service. The archiver uses a host bind mount
  # (./data/archive:/archive/truck-data) which is the correct approach for
  # local inspection of compressed JSONL archives.
  firestore_data:
